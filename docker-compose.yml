services:
  php:
    image: ci4-php82-fpm:8.2
    container_name: adms-local-php
    network_mode: host
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php-fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf:ro
      - ./docker/run:/var/run/php
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: adms-local-nginx
    depends_on:
      - php
    ports:
      - "8090:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/run:/var/run/php
    restart: unless-stopped

  node:
    image: node:20-alpine
    container_name: adms-local-node
    working_dir: /usr/src/app
    volumes:
      - ./socket-server:/usr/src/app
    # socket-server/.env tidak ada di git (lihat socket-server/.env.example) —
    # buat dulu dari contohnya sebelum `docker compose up`. JWT_SECRET di file
    # itu HARUS sama persis dengan JWT_SECRET di .env root (CI4), dan
    # CI4_API_BASE_URL harus http://nginx/api (nginx dijangkau lewat nama
    # service di default bridge network compose ini, php pakai network_mode:
    # host jadi tidak bisa dituju lewat nama service).
    env_file:
      - ./socket-server/.env
    command: sh -c "npm install --omit=dev && node src/server.js"
    ports:
      - "4000:4000"
    depends_on:
      - nginx
    restart: unless-stopped
