services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: chatsapp-valkey
    command: valkey-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/Dockerfile.php
    container_name: chatsapp-php
    network_mode: host
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php-fpm-pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf:ro
      - ./docker/run:/var/run/php
    environment:
      - VALKEY_HOST=127.0.0.1
      - VALKEY_PORT=6379
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: chatsapp-nginx
    depends_on:
      - php
    ports:
      - "8090:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/run:/var/run/php
    restart: unless-stopped

  node:
    image: node:20-alpine
    container_name: chatsapp-node
    working_dir: /usr/src/app
    volumes:
      - ./socket-server:/usr/src/app
    env_file:
      - ./socket-server/.env
    environment:
      - VALKEY_HOST=valkey
      - VALKEY_PORT=6379
      - CI4_API_BASE_URL=http://nginx/api
    command: sh -c "npm install --omit=dev && node src/server.js"
    ports:
      - "4000:4000"
    depends_on:
      - nginx
      - valkey
    restart: unless-stopped

volumes:
  valkey_data:
